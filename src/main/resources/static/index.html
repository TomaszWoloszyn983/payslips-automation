<h1>Payslip Reader</h1>

<form id="uploadForm">
    <input type="file" id="files" name="files" accept=".pdf" multiple required>
    <button type="submit">

</form>

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const files = fileInput.files;

        // No files
        if (files.length === 0) {
            result.textContent = "Please select at least one PDF file.";
            return;
        }

        // Maximum number of files
        if (files.length > MAX_FILES) {
            result.textContent =
                `You can upload a maximum of ${MAX_FILES} payslips at once.`;
            return;
        }

        // Check file types
        for (const file of files) {
            if (file.type !== "application/pdf") {
                result.textContent =
                    `"${file.name}" is not a PDF file.`;
                return;
            }
        }

        const formData = new FormData();

        for (const file of files) {
            formData.append("files", file);
        }

        // result.textContent = "Processing payslips...";
        result.textContent = "Processing payslips... "+"\n\n\tDepending on the size and the number of files"+"\n\tit may take a few minutes.";

        try {
            const response = await fetch("/api/payslip/upload", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const errorMessage = await response.text();
                throw new Error(errorMessage);
            }

            const data = await response.json();

            result.textContent =
                JSON.stringify(data, null, 2);

        } catch (error) {
            result.textContent =
                "Error: " + error.message;
        }
    });
</script>
