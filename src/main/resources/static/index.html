<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Payslip Reader</title>

    <link rel="stylesheet" href="/css/style.css" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <div class="container py-5">
        <div class="row mb-4" id="header-container">
            <h1>Payslip Reader</h1>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">

                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="files" class="form-label">
                            Select payslips
                        </label>

                        <input
                                type="file"
                                id="files"
                                name="files"
                                accept=".pdf"
                                multiple
                                required
                                class="form-control">

                        <div class="form-text">
                            You can upload up to 3 PDF payslips.
                        </div>
                        <div id="errorMessage"
                             class="alert alert-danger mt-4 d-none">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Upload Payslip
                    </button>
                </form>
            </div>
        </div>

        <pre id="result"></pre>
        <div id="resultsSection" class="mt-5 d-none">
            <div class="mb-3">
                <h2>Results</h2>
                <p id="resultsSummary" class="text-muted mb-0"></p>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover table-sm align-middle results-table">
                    <thead id="resultsTableHead" class="table-dark">
                    </thead>

                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>
            <button id="downloadCsvButton"
                    class="btn btn-success mt-3 d-none">
                <i class="bi bi-download"></i>
                Download CSV
            </button>
        </div>
    </div>
    <div id="footer" class="p-3 mb-2 bg-dark text-white">

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="/js/payslips.js"></script>

</body>
</html>
