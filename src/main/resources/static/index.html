<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Payslip Reader</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

<body>
    <div class="container py-5">
        <h1>Payslip Reader</h1>
        <div class="card shadow-sm">
            <div class="card-body">

                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="files" class="form-label">
                            Select payslips
                        </label>

                        <input
                                type="file"
                                id="files"
                                name="files"
                                accept=".pdf"
                                multiple
                                required
                                class="form-control">

                        <div class="form-text">
                            You can upload up to 3 PDF payslips.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Upload Payslip
                    </button>
                </form>
            </div>
        </div>

        <h2>Results</h2>

        <pre id="result"></pre>
        <div id="resultsSection" class="mt-5 d-none">

            <div class="mb-3">
                <h2>Processing Results</h2>
                <p id="resultsSummary" class="text-muted mb-0"></p>
            </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-sm align-middle">

                        <thead id="resultsTableHead" class="table-dark">
                        </thead>

                        <tbody id="resultsTableBody">
                        </tbody>

                    </table>
                </div>

            </div>

        </div>
    </div>

        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
